name: Israel hardware job radar

on:
  schedule:
    # 144 daily wall-clock slots, including nights; follows Israel DST.
    - cron: "1,11,21,31,41,51 * * * *"
      timezone: Asia/Jerusalem
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview matches; send nothing and do not update the database"
        type: boolean
        default: false
      include_existing:
        description: "Send all current matching jobs once, including previously seen jobs"
        type: boolean
        default: false

concurrency:
  group: israel-hw-job-radar
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Restore seen-job database
        uses: actions/cache/restore@v4
        with:
          path: data/seen_jobs.db
          key: seen-jobs-${{ github.run_id }}
          restore-keys: |
            seen-jobs-

      - name: Scan official career sources
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DRY_RUN: ${{ inputs.dry_run }}
          INCLUDE_EXISTING: ${{ inputs.include_existing }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            python run.py --dry-run --no-seed -v
          elif [ "$INCLUDE_EXISTING" = "true" ]; then
            python run.py --include-seen
          else
            python run.py -v
          fi

      - name: Save seen-job database
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/seen_jobs.db
          key: seen-jobs-${{ github.run_id }}
